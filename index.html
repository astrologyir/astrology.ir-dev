      // re-apply stored settings BEFORE first paint — no dark-mode

      // two in sync (validated enums, defaults on unknown).
      (function () {
        try {

            var v = null;
            try { v = localStorage.getItem(k); } catch (e) {}
            return options.indexOf(v) >= 0 ? v : dflt;
          };
          var theme = get('air.theme', ['auto', 'light', 'dark'], 'auto');
          var size = get('air.size', ['sm', 'md', 'lg'], 'md');
          var font = get('air.font', ['vazirmatn', 'shabnam', 'sahel', 'system'], 'vazirmatn');
          var html = document.documentElement;
          if (theme === 'auto') html.removeAttribute('data-theme');
          else html.setAttribute('data-theme', theme);
          html.setAttribute('data-size', size);
          html.setAttribute('data-font', font);
          // Palette pre-paint: forest = attribute absent (keep in sync
          // with lib/design/preferences.ts PALETTES/DEFAULTS.palette).
          var palette = get('air.palette', ['night', 'sepia'], null);
          if (palette) html.setAttribute('data-palette', palette);
          else html.removeAttribute('data-palette');
          // Language pre-paint (§8 detection chain: saved → browser → en).
          // Inline mirror of lib/locales.mjs detectLocale; keep in sync.
          var LOCALES = ['fa', 'ar', 'en', 'fr', 'de', 'es'];
          var loc = get('air.locale', LOCALES, null);
          if (!loc) {
            var tags = (navigator.languages && navigator.languages.length)
              ? navigator.languages
              : (navigator.language ? [navigator.language] : []);
            for (var i = 0; i < tags.length; i++) {
              var tag = String(tags[i]).toLowerCase();
              if (LOCALES.indexOf(tag) >= 0) { loc = tag; break; }
              var base = tag.split('-')[0];
              if (LOCALES.indexOf(base) >= 0) { loc = base; break; }
            }
          }
          loc = loc || 'en';
          html.setAttribute('lang', loc);
          html.setAttribute('dir', loc === 'fa' || loc === 'ar' ? 'rtl' : 'ltr');
        } catch (e) {
          /* defaults come from tokens.css :root */
        }
      })();
