        try {
          var get = function (k, options, dflt) {
            var v = null;
            try { v = localStorage.getItem(k); } catch (e) {}
            return options.indexOf(v) >= 0 ? v : dflt;

          var theme = get('air.theme', ['auto', 'light', 'dark'], 'auto');

          var html = document.documentElement;
          if (theme === 'auto') html.removeAttribute('data-theme');
          else html.setAttribute('data-theme', theme);
          html.setAttribute('data-size', size);
          html.setAttribute('data-font', font);
        } catch (e) {
          /* defaults come from tokens.css :root */
        }
      })();
