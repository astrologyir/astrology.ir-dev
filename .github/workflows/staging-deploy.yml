name: Staging Deploy

on:
  workflow_dispatch:
  repository_dispatch:
    types: [staging-deploy]

permissions:
  contents: write

concurrency:
  group: staging-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout self
        uses: actions/checkout@v5

      - name: Checkout web
        uses: actions/checkout@v5
        with:
          repository: astrologyir/web
          token: ${{ secrets.ENGINE_TOKEN }}
          path: web

      - name: Checkout engine (sibling layout)
        id: engine
        uses: actions/checkout@v5
        with:
          repository: astrologyir/engine
          token: ${{ secrets.ENGINE_TOKEN }}
          path: engine
        continue-on-error: true

      - name: Unbundle engine fallback
        if: steps.engine.outcome != 'success'
        run: |
          rm -rf engine
          git clone --branch main web/vendor/engine.bundle engine

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build swisseph-zig wasm
        uses: actions/checkout@v5
        with:
          repository: mshafiee/swisseph-zig
          ref: v2.10.3-rc2
          path: swisseph-zig

      - name: Install zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build swe.wasm
        working-directory: swisseph-zig
        run: zig build wasm

      - name: Link engine artifacts
        working-directory: web
        env:
          ENGINE_DIR: ${{ github.workspace }}/engine
        run: |
          mkdir -p ../engine/vendor
          cp ../swisseph-zig/zig-out/wasm/swe.wasm ../engine/vendor/swe.wasm
          node tools/link-engine.mjs || true
          node tools/link-citydb.mjs || true

      - name: Build web
        working-directory: web
        run: npm run build

      - name: Commit and push build output
        run: |
          git config user.name "astrologyir-bot"
          git config user.email "bot@astrology.ir"
          rm -rf build engine web swisseph-zig .zig-cache
          mkdir build
          cp -r web/build/* build/
          touch .nojekyll
          git add -A
          git commit -m "deploy: staging build ${{ github.sha }}" || echo "nothing to commit"
          git push origin main